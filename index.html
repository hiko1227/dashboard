<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Tablet Dashboard (簡約無標題版)</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
            --accent-red: #f87171;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px; 
            margin: 0; 
            font-size: 1.3rem;
            -webkit-font-smoothing: antialiased;
        }

        body.night-mode {
            --bg-color: #04060b;
            --card-bg: rgba(0, 0, 0, 0.6);
        }

        .dashboard-container {
            max-width: 1350px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 14px;
        }

        /* 通用面板樣式（無標題，內距微調） */
        .panel { 
            background: var(--card-bg); 
            padding: 18px 20px; 
            border-radius: 16px; 
            border: 1px solid rgba(52, 211, 153, 0.2); 
            backdrop-filter: blur(16px); 
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 頂部 Header 佔左上 */
        .top-header { 
            background: var(--card-bg); 
            padding: 18px 20px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.15); 
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.4);
        }
        
        .header-top-row { display: flex; justify-content: space-between; width: 100%; align-items: center; font-size: 1.4rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-clock-row { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
        .clock { font-size: 4.2rem; font-weight: 900; color: var(--accent-yellow); line-height: 1; text-shadow: 0 0 20px rgba(251,191,36,0.4); }
        .ampm { font-size: 1.4rem; font-weight: 800; color: var(--accent-orange); text-transform: uppercase; }
        .header-holiday-row { font-size: 1.1rem; color: #9ca3af; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; padding-top: 8px; text-align: center; }

        /* 天氣資訊 */
        .wx-box { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; }
        .wx-temp { font-size: 4rem; font-weight: 900; color: var(--accent-yellow); line-height: 1; }

        @keyframes warningBlink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        .warning-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .warning-badge {
            background: rgba(248, 113, 113, 0.3);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            animation: warningBlink 1.5s infinite ease-in-out;
        }

        /* 港鐵排版 */
        .mtr-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mtr-direction-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(192,132,252,0.3);
            border-radius: 12px;
            padding: 12px;
        }
        .mtr-dir-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-purple);
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        /* 交通與備忘容器 */
        .transit-container, .memo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }

        .transit-card, .memo-item {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .route-badge {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-yellow);
            background: rgba(251, 191, 36, 0.25);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid rgba(251, 191, 36, 0.5);
        }

        .transit-input-box, .memo-input-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .transit-input, .memo-input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 1.1rem; outline: none; }
        .transit-add-btn, .memo-btn { background: var(--accent-blue); color: #0b0f19; border: none; padding: 0 16px; border-radius: 8px; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
        .memo-btn { background: var(--accent-green); }

        /* 巴士班次狀態燈 */
        .status-pill {
            font-size: 0.75rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 4px;
            display: inline-block;
            vertical-align: middle;
        }
        .pill-special { background: rgba(245, 158, 11, 0.35); color: var(--accent-orange); border: 1px solid rgba(245, 158, 11, 0.6); }
        .pill-normal { background: rgba(52, 211, 153, 0.3); color: var(--accent-green); border: 1px solid rgba(52, 211, 153, 0.6); }

        .refresh-memo-btn { background: rgba(255, 255, 255, 0.12); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.25); padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 1. 左上：時鐘與假期 -->
        <div class="top-header">
            <div class="header-top-row">
                <span class="date-part" id="date-part">--</span>
                <span class="weekday-part" id="weekday-part">--</span>
            </div>
            <div class="header-clock-row">
                <span class="clock" id="clock">00:00:00</span>
                <span class="ampm" id="ampm">--</span>
            </div>
            <div class="header-holiday-row" id="holiday-countdown">計算假期中...</div>
        </div>

        <!-- 2. 右上：天氣資訊 (已去標題) -->
        <div class="panel">
            <div class="wx-box">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 56px; height: 56px; display: none;" onerror="this.style.display='none'">
                    <span class="wx-temp" id="current-temp">--°C</span>
                </div>
                <div style="text-align: right; font-size: 1.2rem; font-weight: 700;">
                    <div>最高: <span id="wx-max" style="color: var(--accent-orange);">--°C</span></div>
                    <div>最低: <span id="wx-min" style="color: var(--accent-blue);">--°C</span></div>
                </div>
            </div>
            <div id="weather-warning-box" class="warning-container" style="display: none;"></div>
        </div>

        <!-- 3. 左下：港鐵恆安站 (已去標題，去除分鐘旁冗餘字眼) -->
        <div class="panel">
            <div class="mtr-grid-container" id="mtr-eta-list">
                <div style="color: #9ca3af; text-align: center; padding: 15px; grid-column: span 2;">載入港鐵資料中...</div>
            </div>
        </div>

        <!-- 4. 右下：九巴實時到站 (已去標題，加返特別/普通班次燈) -->
        <div class="panel">
            <div class="transit-input-box">
                <input type="text" id="bus-route-input" class="transit-input" style="width: 75px; text-align: center;" placeholder="路線">
                <input type="text" id="bus-stop-input" class="transit-input" style="width: 95px; text-align: center;" placeholder="站ID" value="003345">
                <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱">
                <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
            </div>
            <div class="transit-container" id="bus-eta-list">
                <div style="color: #9ca3af; text-align: center; padding: 15px;">載入巴士資料中...</div>
            </div>
        </div>
    </div>

    <!-- 備忘錄 (已去標題) -->
    <div class="dashboard-container" style="margin-top: 14px;">
        <div class="panel" style="grid-column: span 2;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步雲端</button>
            </div>
            <div class="memo-input-box">
                <input type="text" id="memo-input" class="memo-input" style="flex: 1;" placeholder="輸入新備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                <button class="memo-btn" onclick="addMemo()">新增</button>
            </div>
            <div class="memo-list" id="memo-list" style="max-height: 130px;">
                <div style="color: #9ca3af; text-align: center; padding: 10px;">正在連接雲端...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        const hkHolidays = [
            { name: "中秋節翌日", date: "2026-09-28" },
            { name: "國慶日", date: "2026-10-01" },
            { name: "重陽節", date: "2026-10-23" },
            { name: "聖誕節", date: "2026-12-25" },
            { name: "元旦", date: "2027-01-01" },
            { name: "農曆年初一", date: "2027-02-06" },
            { name: "農曆年初二", date: "2027-02-07" },
            { name: "農曆年初三", date: "2027-02-08" },
            { name: "清明節", date: "2027-04-05" },
            { name: "勞動節", date: "2027-05-01" },
            { name: "端午節", date: "2027-06-09" }
        ];

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            const currentHour = now.getHours();
            if (currentHour >= 19 || currentHour < 6) {
                document.body.classList.add('night-mode');
            } else {
                document.body.classList.remove('night-mode');
            }
        }

        function updateHolidayCountdown() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const upcoming = hkHolidays.map(h => {
                const hDate = new Date(h.date);
                hDate.setHours(0, 0, 0, 0);
                const diffDays = Math.round((hDate - today) / (1000 * 60 * 60 * 24));
                return { ...h, diffDays };
            }).filter(h => h.diffDays >= 0);
            
            upcoming.sort((a, b) => a.diffDays - b.diffDays);
            
            const el = document.getElementById('holiday-countdown');
            if (upcoming.length > 0) {
                const next = upcoming[0];
                let timeText = next.diffDays === 0 ? '就是今天！' : `${next.diffDays} 日後`;
                el.innerHTML = `最近假期: <span style="color: var(--accent-blue);">${next.name}</span> (<span style="color: var(--accent-yellow); font-weight: bold;">${timeText}</span>)`;
            } else {
                el.innerHTML = `暫無近期假期資料`;
            }
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }
                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                    }
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '--°C';
            }
            fetchWeatherWarnings();
        }

        async function fetchWeatherWarnings() {
            const warningBox = document.getElementById('weather-warning-box');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                if (res.ok) {
                    const data = await res.json();
                    let warningHtml = '';
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            const warnItem = data[key];
                            if (warnItem && warnItem.name) {
                                warningHtml += `<span class="warning-badge">⚠️ ${warnItem.name}</span>`;
                            }
                        }
                    }
                    if (warningHtml !== '') {
                        warningBox.innerHTML = warningHtml;
                        warningBox.style.display = 'flex';
                    } else {
                        warningBox.innerHTML = '';
                        warningBox.style.display = 'none';
                    }
                }
            } catch (err) {
                warningBox.style.display = 'none';
            }
        }

        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px; grid-column: span 2;">暫無列車資料</div>';
                        return;
                    }

                    const downTrains = (stationData.DOWN || []).slice(0, 2);
                    const upTrains = (stationData.UP || []).slice(0, 2);
                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };

                    function renderTrainRows(trains) {
                        if (trains.length === 0) return '<div style="color: #6b7280; font-size: 1rem;">暫無班次</div>';
                        return trains.map(t => {
                            const destName = destMap[t.dest] || t.dest || '';
                            const trainTime = new Date(t.time.replace(/-/g, '/'));
                            const diffMin = Math.round((trainTime - new Date()) / 60000);
                            const clockTime = `${String(trainTime.getHours()).padStart(2, '0')}:${String(trainTime.getMinutes()).padStart(2, '0')}`;
                            const timeText = diffMin <= 0 ? '即將到達' : `${diffMin}分鐘`;

                            return `
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 1.1rem;">
                                    <span style="color: #d1d5db;">${destName}</span>
                                    <div style="display: flex; gap: 8px; align-items: baseline;">
                                        <span style="color: var(--accent-green); font-weight: 900; font-size: 1.2rem;">${timeText}</span>
                                        <span style="color: var(--accent-yellow); font-size: 1rem;">${clockTime}</span>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }

                    container.innerHTML = `
                        <div class="mtr-direction-box">
                            <div class="mtr-dir-title">⬇️ 屯門方向</div>
                            ${renderTrainRows(downTrains)}
                        </div>
                        <div class="mtr-direction-box">
                            <div class="mtr-dir-title">⬆️ 烏溪沙方向</div>
                            ${renderTrainRows(upTrains)}
                        </div>
                    `;
                }
            } catch (e) {}
        }

        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();

            if (routes.length === 0) {
                container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">請於上方新增路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                try {
                    let etas = [];
                    for (let st = 1; st <= 2; st++) {
                        try {
                            const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/${st}`);
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.data) {
                                    if (Array.isArray(data.data)) { etas = etas.concat(data.data); } 
                                    else { etas.push(data.data); }
                                }
                            }
                        } catch (err) {}
                    }
                    
                    let etasListHtml = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            const uniqueEtas = [];
                            validEtas.forEach(e => {
                                const eTime = new Date(e.eta).getTime();
                                const isDuplicate = uniqueEtas.some(existing => Math.abs(eTime - new Date(existing.eta).getTime()) < 60000);
                                if (!isDuplicate) uniqueEtas.push(e);
                            });

                            const topEtas = uniqueEtas.slice(0, 2);
                            etasListHtml = topEtas.map((e) => {
                                const nextTime = new Date(e.eta);
                                const diffMin = Math.round((nextTime - new Date()) / 60000);
                                const timeStr = diffMin <= 1 ? '將到達' : `${diffMin}分鐘`;
                                const clockTime = `${String(nextTime.getHours()).padStart(2, '0')}:${String(nextTime.getMinutes()).padStart(2, '0')}`;
                                
                                // 判斷特別班次 rm: remark
                                let statusPill = '<span class="status-pill pill-normal">普通</span>';
                                if (e.rm_tc && (e.rm_tc.includes('特別') || e.rm_tc.includes('特班') || e.rm_tc.includes('循環'))) {
                                    statusPill = `<span class="status-pill pill-special" title="${e.rm_tc}">特別</span>`;
                                }

                                return `<span><span style="color: var(--accent-green); font-weight: 900;">${timeStr}</span>${statusPill} <span style="font-size:0.9rem; color:#9ca3af;">(${clockTime})</span></span>`;
                            }).join(' | ');
                        } else {
                            etasListHtml = '<span style="color: #9ca3af; font-size: 1rem;">暫無班次</span>';
                        }
                    } else {
                        etasListHtml = '<span style="color: #9ca3af; font-size: 1rem;">暫無班次</span>';
                    }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="route-badge">${r.route}</span>
                                <span style="font-size: 1.1rem; font-weight: bold; color: var(--accent-blue);">${r.name || ''}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div>${etasListHtml}</div>
                                <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.2rem;">✕</button>
                            </div>
                        </div>
                    `;
                } catch (err) {}
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            const stopVal = stopInput.value.trim() || '003345';
            const nameVal = nameInput.value.trim();

            if (!routeVal) return;
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopVal, name: nameVal });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = '';
            nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span style="font-size: 1.1rem;">• ${text}</span>
                    <button style="color:#f87171; background:none; border:none; font-weight:bold; cursor:pointer; font-size:1.2rem;" onclick="deleteMemo(${index})">✕</button>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;
            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async timeDeleteMemo(index) { deleteMemo(index); }
        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        updateHolidayCountdown();
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
