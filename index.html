<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Dashboard</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            margin: 0; 
            font-size: 1.15rem;
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 12px 18px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            max-width: 1200px; 
            margin: 0 auto 8px auto; 
            display: grid; 
            grid-template-columns: 1.5fr 1.5fr 0.5fr; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .header-left { display: flex; align-items: baseline; gap: 10px; font-size: 2.2rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-center { text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
        .clock { font-size: 2.2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .ampm { font-size: 1.1rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .header-right { display: flex; align-items: center; justify-content: flex-end; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px; max-width: 1200px; margin: auto; }
        .panel { 
            background: var(--card-bg); padding: 12px 16px; border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); margin-bottom: 8px;
        }
        .panel-title { 
            font-size: 1.2rem; color: var(--accent-green); font-weight: 700; margin-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .wx-box { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .wx-temp { font-size: 2.6rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        
        .direct-link-btn {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .direct-link-btn:hover { background: rgba(255,255,255,0.2); }

        .memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 1.15rem; outline: none; }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 600; gap: 8px; }
        .memo-actions { display: flex; gap: 4px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .memo-action-btn:hover { background: rgba(255,255,255,0.2); }
        .memo-delete { color: #f87171; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 2px 4px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }

        .transit-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 6px;
        }
        .transit-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .route-badge {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-yellow);
            background: rgba(251, 191, 36, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .transit-input-box {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .transit-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
        }
        .transit-add-btn {
            background: var(--accent-blue);
            color: #0b0f19;
            border: none;
            padding: 0 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-left">
            <span class="date-part" id="date-part">--</span>
            <span class="weekday-part" id="weekday-part">--</span>
        </div>
        <div class="header-center">
            <span class="clock" id="clock">00:00:00</span>
            <span class="ampm" id="ampm">--</span>
        </div>
        <div class="header-right">
            <svg id="moon-svg" viewBox="0 0 48 48" width="48" height="48" title="即時月相" style="filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.3));">
                <circle cx="24" cy="24" r="22" fill="#e5e7eb" />
                <path id="moon-shadow-path" fill="#0b0f19" opacity="0.92" />
            </svg>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左邊欄 -->
        <div>
            <!-- 天氣面板 -->
            <div class="panel">
                <div class="panel-title"><span>☀️ 香港天文台 (沙田實況)</span></div>
                <div class="wx-box">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 52px; height: 52px; display: none;" onerror="this.style.display='none'">
                        <span class="wx-temp" id="current-temp">--°C</span>
                    </div>
                    <div style="text-align: right; font-size: 1.1rem; font-weight: 600;">
                        <div>最高: <span id="wx-max" style="color: var(--accent-orange);">--°C</span></div>
                        <div>最低: <span id="wx-min" style="color: var(--accent-blue);">--°C</span></div>
                    </div>
                </div>
            </div>

            <!-- 備忘錄面板 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1.1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <!-- 右邊欄 -->
        <div>
            <!-- 九巴實時 ETA 面板 -->
            <div class="panel">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
                    <a href="https://search.kmb.hk/" target="_blank" class="direct-link-btn">九巴網 ↗</a>
                </div>
                <div class="transit-input-box">
                    <input type="text" id="bus-route-input" class="transit-input" style="width: 70px; text-align: center;" placeholder="路線">
                    <input type="text" id="bus-stop-input" class="transit-input" style="width: 85px; text-align: center;" placeholder="站ID" value="003345">
                    <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱 (例: 返工/返屋企)">
                    <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
                </div>
                <div class="transit-container" id="bus-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 15px; font-size: 1.1rem;">載入九巴資料中...</div>
                </div>
            </div>

            <!-- 港鐵恆安站 API 實時面板 (行距已縮短，已移除方向標題) -->
            <div class="panel">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
                    <button class="refresh-memo-btn" onclick="fetchMTR()">🔄 更新港鐵</button>
                </div>
                <div class="transit-container" id="mtr-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 15px; font-size: 1.1rem;">載入港鐵實時資料中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.14/lunar.js"></script>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            try {
                const solar = Solar.fromDate(now);
                const lunar = solar.getLunar();
                const lunarDay = lunar.getDay();
                
                const path = document.getElementById('moon-shadow-path');
                if (path) {
                    const phase = (lunarDay - 1) / 29.5;
                    const angle = phase * 2 * Math.PI;
                    const cosT = Math.cos(angle);
                    const R = 22;
                    const cx = 24, cy = 24;
                    
                    let shadowPath = "";
                    if (lunarDay === 1 || lunarDay === 30) {
                        shadowPath = `M ${cx-R},${cy} A ${R},${R} 0 1,0 ${cx+R},${cy} A ${R},${R} 0 1,0 ${cx-R},${cy}`;
                    } else if (lunarDay === 15) {
                        shadowPath = "";
                    } else {
                        const rx = R * Math.abs(cosT);
                        if (phase <= 0.5) {
                            shadowPath = `M ${cx},${cy-R} A ${R},${R} 0 0,0 ${cx},${cy+R} A ${rx},${R} 0 0,${cosT >= 0 ? 1 : 0} ${cx},${cy-R}`;
                        } else {
                            shadowPath = `M ${cx},${cy-R} A ${R},${R} 0 0,1 ${cx},${cy+R} A ${rx},${R} 0 0,${cosT >= 0 ? 1 : 0} ${cx},${cy-R}`;
                        }
                    }
                    path.setAttribute('d', shadowPath);
                }
            } catch (e) {}
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }
                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                    }
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '--°C';
            }
        }

        // 港鐵 API 抓取 (恆安站 TML-HEO，已移除方向標題、縮短行距)
        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1.1rem;">暫無列車資料</div>';
                        return;
                    }

                    const upTrains = stationData.UP || [];
                    const downTrains = stationData.DOWN || [];
                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };

                    let html = '';
                    const renderTrains = (trains) => {
                        if (trains.length === 0) return '';
                        return trains.slice(0, 2).map(t => {
                            const destName = destMap[t.dest] || t.dest;
                            const trainTime = new Date(t.time.replace(/-/g, '/'));
                            const diffMin = Math.round((trainTime - new Date()) / 60000);
                            
                            const trainHours = String(trainTime.getHours()).padStart(2, '0');
                            const trainMinutes = String(trainTime.getMinutes()).padStart(2, '0');
                            const clockTime = `${trainHours}:${trainMinutes}`;

                            const timeText = diffMin <= 0 ? `即將到達 (${clockTime})` : `${diffMin} 分鐘 (${clockTime})`;
                            return `
                                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px; margin-bottom: 3px; font-size: 1.1rem;">
                                    <span>往 <b>${destName}</b> <span style="font-size:0.95rem; color:#9ca3af;">(月台 ${t.plat})</span></span>
                                    <span style="color: var(--accent-green); font-weight: bold;">${timeText}</span>
                                </div>
                            `;
                        }).join('');
                    };

                    html += renderTrains(upTrains);
                    html += renderTrains(downTrains);
                    if (!html) {
                        html = '<div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1.1rem;">暫無班次</div>';
                    }
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 10px; font-size: 1.1rem;">港鐵系統維護中</div>';
                }
            } catch (e) {
                container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 10px; font-size: 1.1rem;">港鐵連線失敗</div>';
            }
        }

        // 九巴自選路線管理
        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();

            if (routes.length === 0) {
                container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1.1rem;">請於上方新增你想查詢嘅九巴路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                
                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/1`);
                    const data = await res.json();
                    const etas = data.data;
                    
                    let etasListHtml = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            const topEtas = validEtas.slice(0, 3);
                            etasListHtml = topEtas.map((e, idx) => {
                                const nextTime = new Date(e.eta);
                                const diffMin = Math.round((nextTime - new Date()) / 60000);
                                const timeStr = diffMin <= 1 ? '將到達' : `${diffMin} 分鐘`;
                                
                                const hours = String(nextTime.getHours()).padStart(2, '0');
                                const mins = String(nextTime.getMinutes()).padStart(2, '0');
                                const clockTime = `${hours}:${mins}`;

                                const rmk = e.rmk_tc ? `<span style="color: var(--accent-orange); font-size: 0.9rem; background: rgba(245, 158, 11, 0.2); padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold;">${e.rmk_tc}</span>` : '';
                                const label = idx === 0 ? '首班' : `後${idx}`;

                                return `
                                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 4px;">
                                        <span style="color: #9ca3af;">${label}: <strong style="color: var(--accent-green); font-size: 1.1rem;">${timeStr}</strong> <span style="font-size: 0.95rem;">(${clockTime})</span></span>
                                        ${rmk}
                                    </div>
                                `;
                            }).join('');
                        } else {
                            etasListHtml = '<div style="color: #9ca3af; font-size: 1.05rem; margin-top: 6px;">暫無班次</div>';
                        }
                    } else {
                        etasListHtml = '<div style="color: #9ca3af; font-size: 1.05rem; margin-top: 6px;">暫無班次</div>';
                    }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                    <span class="route-badge">${r.route}</span>
                                    <span style="font-size: 0.95rem; color: #9ca3af;">(${r.stop})</span>
                                    ${r.name ? `<span style="font-size: 1.15rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                </div>
                                <div style="margin-top: 4px;">
                                    ${etasListHtml}
                                </div>
                            </div>
                            <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.3rem; padding: 4px; margin-left: 8px;">✕</button>
                        </div>
                    `;
                } catch (err) {
                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                    <span class="route-badge">${r.route}</span>
                                    <span style="font-size: 0.95rem; color: #9ca3af;">(${r.stop})</span>
                                    ${r.name ? `<span style="font-size: 1.15rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                </div>
                                <div style="color: #f87171; font-size: 1.05rem; margin-top: 6px;">讀取失敗</div>
                            </div>
                            <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.3rem;">✕</button>
                        </div>
                    `;
                }
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            const stopVal = stopInput.value.trim() || '003345';
            const nameVal = nameInput.value.trim();

            if (!routeVal) return;
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopVal, name: nameVal });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = '';
            nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1.1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;
            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
