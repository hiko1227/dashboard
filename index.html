<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Dashboard</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            margin: 0; 
            font-size: 1.15rem;
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 12px 18px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            max-width: 1200px; 
            margin: 0 auto 8px auto; 
            display: grid; 
            grid-template-columns: 1.5fr 1.5fr 0.5fr; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .header-left { display: flex; align-items: baseline; gap: 10px; font-size: 2.2rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-center { text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
        .clock { font-size: 2.2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .ampm { font-size: 1.1rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .header-right { display: flex; align-items: center; justify-content: flex-end; }

        .realistic-moon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e5e7eb 0%, #9ca3af 40%, #1f2937 70%, #030712 100%);
            box-shadow: inset -8px -4px 12px rgba(0, 0, 0, 0.9), 0 0 10px rgba(192, 132, 252, 0.3);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .moon-shadow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); border-radius: 50%;
            transition: transform 0.5s ease; transform-origin: center;
        }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px; max-width: 1200px; margin: auto; }
        .panel { 
            background: var(--card-bg); padding: 12px 16px; border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); margin-bottom: 8px;
        }
        .panel-title { 
            font-size: 1.2rem; color: var(--accent-green); font-weight: 700; margin-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .wx-temp-box { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
        .wx-temp { font-size: 2.8rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .forecast-container { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .forecast-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }
        
        .direct-link-btn {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .direct-link-btn:hover { background: rgba(255,255,255,0.2); }

        .memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 1.15rem; outline: none; }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 600; gap: 8px; }
        .memo-actions { display: flex; gap: 4px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .memo-action-btn:hover { background: rgba(255,255,255,0.2); }
        .memo-delete { color: #f87171; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 2px 4px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        /* 交通 API 專用樣式 */
        .transit-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 230px;
            overflow-y: auto;
            margin-top: 6px;
        }
        .transit-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .route-badge {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-yellow);
            background: rgba(251, 191, 36, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .transit-input-box {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .transit-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .transit-add-btn {
            background: var(--accent-blue);
            color: #0b0f19;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-left">
            <span class="date-part" id="date-part">--</span>
            <span class="weekday-part" id="weekday-part">--</span>
        </div>
        <div class="header-center">
            <span class="clock" id="clock">00:00:00</span>
            <span class="ampm" id="ampm">--</span>
        </div>
        <div class="header-right">
            <div class="realistic-moon" title="即時月相">
                <div class="moon-shadow" id="moon-shadow"></div>
            </div>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左邊欄 -->
        <div>
            <!-- 天氣面板 -->
            <div class="panel">
                <div class="panel-title"><span>☀️ 香港天文台 (沙田實況)</span></div>
                <div class="wx-temp-box">
                    <span class="wx-temp" id="current-temp">--°C</span>
                    <span style="font-size: 2.2rem;">⛅</span>
                </div>
                <div style="margin-top: 4px; font-size: 1rem;">狀況: <span id="current-desc" style="color:var(--accent-blue); font-weight:700;">連線中...</span></div>
                
                <div class="forecast-container">
                    <div style="font-size: 0.95rem; color: var(--accent-green); font-weight: 700;">🔮 天文台明日預報</div>
                    <div class="forecast-row"><span id="fc-date-1">--</span><span id="fc-wx-1">讀取中...</span></div>
                </div>
            </div>

            <!-- 備忘錄面板 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <!-- 右邊欄 -->
        <div>
            <!-- 港鐵恆安站 API 實時面板 (連到站時間) -->
            <div class="panel">
                <div class="panel-title">
                    <span>🚇 港鐵恆安站 (屯馬綫)</span>
                    <button class="refresh-memo-btn" onclick="fetchMTR()">🔄 更新</button>
                </div>
                <div class="transit-container" id="mtr-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 15px;">載入港鐵實時資料中...</div>
                </div>
            </div>

            <!-- 九巴實時 ETA 面板 (支援自選名稱、路線及站號) -->
            <div class="panel">
                <div class="panel-title">
                    <span>🚌 九巴實時 ETA (自選管理)</span>
                    <a href="https://search.kmb.hk/" target="_blank" class="direct-link-btn">九巴網 ↗</a>
                </div>
                <div class="transit-input-box">
                    <input type="text" id="bus-route-input" class="transit-input" style="width: 65px; text-align: center;" placeholder="路線">
                    <input type="text" id="bus-stop-input" class="transit-input" style="width: 75px; text-align: center;" placeholder="站ID" value="003345">
                    <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱 (例: 返工/返屋企)">
                    <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
                </div>
                <div class="transit-container" id="bus-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 15px;">載入九巴資料中...</div>
                </div>
            </div>

            <!-- 星象面板 -->
            <div class="panel">
                <div class="panel-title"><span>♑ 摩羯座 (Capricorn) 每日運勢</span></div>
                <div id="horoscope-content" style="font-size: 1.05rem; padding-top: 4px; line-height: 1.5;">
                    計算中...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.14/lunar.js"></script>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            try {
                const solar = Solar.fromDate(now);
                const lunar = solar.getLunar();
                const lunarDay = lunar.getDay();
                let shadowTransform = 'translateX(0%)';
                if (lunarDay === 1) shadowTransform = 'translateX(0%)';
                else if (lunarDay > 1 && lunarDay < 7) shadowTransform = 'translateX(35%)';
                else if (lunarDay === 7 || lunarDay === 8) shadowTransform = 'translateX(50%)';
                else if (lunarDay > 8 && lunarDay < 15) shadowTransform = 'translateX(75%)';
                else if (lunarDay === 15 || lunarDay === 16) shadowTransform = 'translateX(100%)';
                else if (lunarDay > 16 && lunarDay < 22) shadowTransform = 'translateX(-75%)';
                else if (lunarDay === 22 || lunarDay === 23) shadowTransform = 'translateX(-50%)';
                else shadowTransform = 'translateX(-35%)';
                document.getElementById('moon-shadow').style.transform = shadowTransform;
            } catch (e) {}
        }

        function updateHoroscope() {
            const today = new Date();
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const random = (s) => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
            const levels = ['⭐⭐⭐ 平穩', '⭐⭐⭐⭐ 順遂', '⭐⭐⭐⭐⭐ 極佳', '⭐⭐⭐ 沉澱', '⭐⭐⭐⭐ 突破'];
            const aspects = [
                '今日適合專注處理細節，寫作靈感可能會喺獨處時湧現，不妨將點滴記錄低。',
                '直覺特別敏銳，對於過往嘅回憶或人際關係會有新嘅深刻體會。',
                '工作同創作都能夠穩步向前，適合為自己定下一個實質嘅小目標。',
                '需要多一點耐心，今日適合靜心思考未來計劃，理清思路。',
                '可能會接觸到一啲懷舊嘅人事物或舊有興趣，為你帶嚟意想不到嘅啟發。'
            ];
            const colors = ['深藍色 (沉穩)', '大地色 (踏實)', '銀灰色 (理性)', '暗紅色 (內斂)', '黑色 (專注)'];
            document.getElementById('horoscope-content').innerHTML = `
                <div style="display: flex; gap: 12px; margin-bottom: 8px; margin-top: 4px;">
                    <div>運勢：<span style="color: var(--accent-yellow); font-weight: bold;">${levels[Math.floor(random(seed) * levels.length)]}</span></div>
                    <div>幸運色：<span style="color: var(--accent-blue); font-weight: bold;">${colors[Math.floor(random(seed + 2) * colors.length)]}</span></div>
                </div>
                <div style="color: #d1d5db; font-size: 0.95rem;">💡 ${aspects[Math.floor(random(seed + 1) * aspects.length)]}</div>
            `;
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }
                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    let f = fData.weatherForecast[0];
                    document.getElementById('fc-date-1').textContent = `${parseInt(f.forecastDate.substring(4,6))}月${parseInt(f.forecastDate.substring(6,8))}日`;
                    document.getElementById('fc-wx-1').textContent = `${f.forecastWeather} (${f.forecastMintemp.value}°C - ${f.forecastMaxtemp.value}°C)`;
                    document.getElementById('current-desc').textContent = fData.generalSituation || '天文台運作正常';
                }
            } catch (e) {
                document.getElementById('current-desc').textContent = '天文台數據更新中';
            }
        }

        // 港鐵 API 抓取 (恆安站 TML-HEO) + 顯示具體到站時間
        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">暫無列車資料</div>';
                        return;
                    }

                    const upTrains = stationData.UP || [];
                    const downTrains = stationData.DOWN || [];
                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };

                    let html = '';
                    const renderGroup = (trains, title) => {
                        if (trains.length === 0) return `<div style="font-size:0.9rem; color:#9ca3af; margin-bottom:4px;">${title}：暫無班次</div>`;
                        let resHtml = `<div style="font-size:0.85rem; color:var(--accent-blue); font-weight:bold; margin-bottom:3px;">${title}</div>`;
                        resHtml += trains.slice(0, 2).map(t => {
                            const destName = destMap[t.dest] || t.dest;
                            const trainTime = new Date(t.time.replace(/-/g, '/'));
                            const diffMin = Math.round((trainTime - new Date()) / 60000);
                            
                            const trainHours = String(trainTime.getHours()).padStart(2, '0');
                            const trainMinutes = String(trainTime.getMinutes()).padStart(2, '0');
                            const clockTime = `${trainHours}:${trainMinutes}`;

                            const timeText = diffMin <= 0 ? `即將到達 (${clockTime})` : `${diffMin} 分鐘 (${clockTime})`;
                            return `
                                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 5px 8px; border-radius: 6px; margin-bottom: 3px; font-size: 0.95rem;">
                                    <span>往 <b>${destName}</b> <span style="font-size:0.8rem; color:#9ca3af;">(月台 ${t.plat})</span></span>
                                    <span style="color: var(--accent-green); font-weight: bold; font-size: 0.9rem;">${timeText}</span>
                                </div>
                            `;
                        }).join('');
                        return resHtml;
                    };

                    html += renderGroup(upTrains, '方向一 (市區 / 屯門方向)');
                    html += renderGroup(downTrains, '方向二 (烏溪沙方向)');
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 10px;">港鐵系統維護中</div>';
                }
            } catch (e) {
                container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 10px;">港鐵連線失敗</div>';
            }
        }

        // 九巴自選路線、站號與自訂名稱管理
        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();

            if (routes.length === 0) {
                container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">請於上方新增你想查詢嘅九巴路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                let nameHtml = r.name ? `<div style="font-size: 1rem; font-weight: bold; color: var(--accent-blue); margin-bottom: 2px;">${r.name}</div>` : '';
                
                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/1`);
                    const data = await res.json();
                    const etas = data.data;
                    
                    let timeStr = '暫無班次';
                    let subStr = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            const nextTime = new Date(validEtas[0].eta);
                            const diffMin = Math.round((nextTime - new Date()) / 60000);
                            timeStr = diffMin <= 1 ? '將到達' : `${diffMin} 分鐘`;
                            
                            if (validEtas[1]) {
                                const secondTime = new Date(validEtas[1].eta);
                                const diffMin2 = Math.round((secondTime - new Date()) / 60000);
                                subStr = `後續: ${diffMin2 <= 1 ? '將到達' : diffMin2 + '分鐘'}`;
                            }
                        }
                    }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                ${nameHtml}
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span class="route-badge">${r.route}</span>
                                    <span style="font-size: 0.8rem; color: #9ca3af;">(站: ${r.stop})</span>
                                </div>
                            </div>
                            <div style="text-align: right; margin-right: 8px;">
                                <div style="font-size: 1rem; font-weight: 700; color: var(--accent-green);">${timeStr}</div>
                                <div style="font-size: 0.8rem; color: #9ca3af;">${subStr}</div>
                            </div>
                            <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.1rem; padding: 4px;">✕</button>
                        </div>
                    `;
                } catch (err) {
                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                ${nameHtml}
                                <div><span class="route-badge">${r.route}</span> <span style="font-size:0.8rem; color:#9ca3af;">(站: ${r.stop})</span></div>
                            </div>
                            <div style="color: #f87171; font-size: 0.9rem; margin-right: 8px;">讀取失敗</div>
                            <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.1rem;">✕</button>
                        </div>
                    `;
                }
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            const stopVal = stopInput.value.trim() || '003345';
            const nameVal = nameInput.value.trim();

            if (!routeVal) return;
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopVal, name: nameVal });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = '';
            nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;
            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        updateHoroscope();
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
