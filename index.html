<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Tablet Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.045); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
            --accent-red: #f87171;
            --accent-pink: #f472b6;
            --sub-text: #9ca3af;
            --box-bg: rgba(0, 0, 0, 0.35);
            --border-color: rgba(52, 211, 153, 0.2);
            --btn-gray: rgba(255,255,255,0.08);
            --bobo-bubble-bg: rgba(96, 165, 250, 0.12);
        }

        /* 🎨 Light Mode 調校 */
        body.light-mode {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-yellow: #d97706;
            --accent-purple: #7c3aed;
            --accent-orange: #ea580c;
            --accent-red: #dc2626;
            --accent-pink: #db2777;
            --sub-text: #64748b;
            --box-bg: #f8fafc;
            --border-color: #e2e8f0;
            --btn-gray: #e2e8f0;
            --bobo-bubble-bg: #eff6ff;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; 
            margin: 0; 
            font-size: 1.15rem; 
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            max-width: 1400px; 
            margin: auto; 
        } 
        
        .panel { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: space-between;
        }

        .panel-top-left { justify-content: center; }

        .theme-toggle-btn {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* 🐾 寶寶助手專區 */
        .bobo-widget {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bobo-bubble-bg);
            border: 1px solid var(--accent-blue);
            border-radius: 14px;
            padding: 12px 18px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .bobo-widget:active {
            transform: scale(0.98);
        }
        .bobo-avatar-container {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .bobo-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bobo-dialog {
            flex: 1;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.35;
        }

        .clock { 
            font-size: 4.2rem; 
            font-weight: 800; 
            color: var(--accent-yellow); 
            line-height: 1; 
        }
        body.light-mode .clock,
        body.light-mode .wx-temp {
            color: #0f172a;
        }

        body:not(.light-mode) .clock {
            text-shadow: 0 0 20px rgba(251,191,36,0.3);
        }

        .ampm { font-size: 1.4rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .wx-box { display: flex; align-items: center; justify-content: space-between; }
        .wx-temp { font-size: 3.4rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }

        /* 🚨 天氣警告特殊標示與動態效果 */
        @keyframes warningPulse {
            0% { transform: scale(1); box-shadow: 0 0 4px rgba(248, 113, 113, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 16px rgba(248, 113, 113, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 4px rgba(248, 113, 113, 0.4); }
        }

        @keyframes blackRainBlink {
            0% { border-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
            50% { border-color: #ffffff; box-shadow: 0 0 20px #ffffff; }
            100% { border-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        }

        .warning-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
        
        /* 通用警告 */
        .warning-badge {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: warningPulse 1.8s infinite ease-in-out;
        }

        /* 黄雨 / 1號戒備信號 */
        .warning-yellow {
            background: rgba(251, 191, 36, 0.2) !important;
            color: #f59e0b !important;
            border: 2px solid #f59e0b !important;
        }

        /* 紅雨 / 3號強風信號 */
        .warning-red {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border: 2px solid #ef4444 !important;
            font-size: 1.25rem !important;
        }

        /* 黑雨 / 8號或以上烈風/暴風/颶風信號 */
        .warning-black {
            background: #111827 !important;
            color: #f87171 !important;
            border: 2px solid #ef4444 !important;
            font-size: 1.3rem !important;
            animation: blackRainBlink 1s infinite ease-in-out !important;
        }

        /* 備忘錄 */
        .memo-section-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .memo-input-box { display: flex; gap: 10px; margin-top: 6px; margin-bottom: 10px; }
        .memo-input { 
            flex: 1; 
            background: var(--box-bg); 
            border: 1px solid var(--border-color); 
            padding: 12px 16px; 
            border-radius: 12px; 
            color: var(--text-main); 
            font-size: 1.25rem; 
            outline: none; 
        }
        .memo-btn { 
            background: var(--accent-blue); 
            color: #ffffff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.2rem; 
            cursor: pointer; 
        }

        .memo-list { display: flex; flex-direction: column; gap: 10px; min-height: 200px; max-height: 320px; overflow-y: auto; }
        .memo-item { 
            background: var(--box-bg); 
            padding: 12px 16px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 1.35rem; 
            font-weight: 600; 
            gap: 12px; 
            border: 1px solid var(--border-color); 
        }

        .memo-actions { display: flex; gap: 8px; }
        .memo-action-btn { 
            background: var(--btn-gray); 
            color: var(--text-main); 
            border: none; 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem; 
        }
        .memo-delete { color: var(--accent-red); background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1.4rem; padding: 0 8px; }

        .refresh-memo-btn { background: var(--box-bg); color: var(--sub-text); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; }

        .transit-container { display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; }

        .mtr-grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; height: 100%; }
        .mtr-card-big {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            min-height: 130px;
        }

        .memo-list::-webkit-scrollbar { width: 6px; }
        .memo-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; }

        @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="main-grid">
        <!-- 左上：日期、農曆與大時鐘 -->
        <div class="panel panel-top-left">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="display: flex; align-items: baseline; gap: 14px;">
                    <span class="date-part" id="date-part" style="font-size: 1.6rem; font-weight: 800;">--</span>
                    <span class="weekday-part" id="weekday-part" style="font-size: 1.6rem; font-weight: 800; color: var(--accent-blue);">--</span>
                </div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="切換 Light / Dark 模式">🌓</button>
            </div>

            <div id="lunar-info" style="font-size: 1.25rem; color: var(--accent-purple); font-weight: bold; text-align: center; background: var(--box-bg); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);">
                載入農曆中...
            </div>
            
            <div style="text-align: center; margin-top: 12px;">
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 12px;">
                    <span class="clock" id="clock">00:00:00</span>
                    <span class="ampm" id="ampm">--</span>
                </div>
            </div>
        </div>

        <!-- 右上：寶寶圖片對話助手 + 天氣資訊與假期倒數 -->
        <div class="panel">
            <!-- 🐾 寶寶小助手區塊 -->
            <div class="bobo-widget" onclick="triggerBoboSpeech(true)">
                <div class="bobo-avatar-container">
                    <img id="bobo-avatar" class="bobo-avatar-img" src="" alt="寶寶">
                </div>
                <div class="bobo-dialog" id="bobo-speech-text">寶寶正在幫你監看中...</div>
            </div>

            <div class="wx-box">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 72px; height: 72px; display: none;" onerror="this.style.display='none'">
                    <div>
                        <div style="display: flex; align-items: baseline; gap: 10px;">
                            <span class="wx-temp" id="current-temp">--°C</span>
                        </div>
                        <div style="font-size: 1.4rem; font-weight: bold; margin-top: 6px; display: flex; gap: 14px; align-items: center;">
                            <span style="color: var(--accent-blue);">濕度: <span id="current-humidity">--%</span></span>
                            <span style="color: var(--sub-text);">|</span>
                            <span style="color: var(--accent-green);">降雨: <span id="wx-rain">--</span></span>
                        </div>
                    </div>
                </div>
                <div style="text-align: right; font-size: 1.3rem; font-weight: bold; background: var(--box-bg); padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border-color);">
                    <div style="color: var(--accent-orange);">最高: <span id="wx-max">--°C</span></div>
                    <div style="color: var(--accent-blue); margin-top: 6px;">最低: <span id="wx-min">--°C</span></div>
                </div>
            </div>
            
            <div id="weather-warning-box" class="warning-container" style="display: none;"></div>
            
            <div id="holiday-countdown" style="margin-top: auto; background: var(--box-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color);">
                <span style="font-size: 1.15rem; color: var(--sub-text);">計算假期中...</span>
            </div>
        </div>

        <!-- 左下：港鐵恆安站 -->
        <div class="panel">
            <div style="font-size: 1.3rem; font-weight: 800; color: var(--accent-blue); margin-bottom: 4px;">
                🚆 港鐵恆安站 實時班次
            </div>
            <div class="transit-container" id="mtr-eta-list">
                <div style="color: var(--sub-text); text-align: center; padding: 20px; font-size: 1.2rem;">載入港鐵實時資料中...</div>
            </div>
        </div>

        <!-- 右下：放大版備忘錄 -->
        <div class="panel">
            <div class="memo-section-title">
                <span>📝 備忘事項</span>
                <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步雲端</button>
            </div>
            <div class="memo-input-box">
                <input type="text" id="memo-input" class="memo-input" placeholder="新增備忘事項..." onkeypress="if(event.key==='Enter')addMemo()">
                <button class="memo-btn" onclick="addMemo()">新增</button>
            </div>
            <div class="memo-list" id="memo-list">
                <div style="color: var(--sub-text); text-align: center; padding: 12px; font-size: 1.2rem;">正在讀取備忘...</div>
            </div>
        </div>
    </div>

    <script>
        const NPOINT_URL = "https://api.npoint.io/6c4e46cd350165fe37c2";

        function loadSmartImage(imgElement, baseName) {
            const extensions = ['.jpeg', '.jpg', '.png', '.webp', '.JPEG', '.JPG', '.PNG'];
            let extIndex = 0;

            function tryNext() {
                if (extIndex < extensions.length) {
                    const currentExt = extensions[extIndex++];
                    imgElement.src = './' + baseName + currentExt;
                } else {
                    imgElement.onerror = null;
                    imgElement.parentNode.innerHTML = '<span style="font-size: 2.6rem; line-height: 1;">🐱</span>';
                }
            }

            imgElement.onerror = tryNext;
            tryNext();
        }

        const boboQuotes = {
            morning: [
                { text: "早晨呀！記得飲水同食早餐！", img: "bobo_happy" },
                { text: "今日又係充滿活力嘅一日呀~", img: "bobo_curious" },
                { text: "寶寶醒咗啦，加油！", img: "bobo_playful" }
            ],
            afternoon: [
                { text: "下午茶時間到了！有冇罐罐份？", img: "bobo_love" },
                { text: "坐得太久要伸個懶腰喵~", img: "bobo_cozy" },
                { text: "寶寶喺度同你一齊睇住 Dashboard！", img: "bobo_curious" }
            ],
            night: [
                { text: "今晚早啲休息，唔好太遲睡~", img: "bobo_cozy" },
                { text: "聽日又係新嘅一日，今晚食咩好？", img: "bobo_shy" },
                { text: "今日辛苦啦，伸個懶腰睡覺~", img: "bobo_happy" }
            ],
            interactive: [
                { text: "按我有罐罐食嗎？喵！", img: "bobo_love" },
                { text: "寶寶監測中：一切運作正常！", img: "bobo_curious" },
                { text: "害羞~ 不要一直點我啦！", img: "bobo_shy" },
                { text: "你有沒有記得更新備忘錄呀？", img: "bobo_playful" },
                { text: "最喜歡陪住你啦！", img: "bobo_happy" },
                { text: "好舒服，想睡個小覺~", img: "bobo_cozy" }
            ]
        };

        function triggerBoboSpeech(isClick = false) {
            const hour = new Date().getHours();
            let pool = [];

            if (isClick) {
                pool = boboQuotes.interactive;
            } else {
                if (hour >= 5 && hour < 12) pool = boboQuotes.morning;
                else if (hour >= 12 && hour < 18) pool = boboQuotes.afternoon;
                else pool = boboQuotes.night;
            }

            const item = pool[Math.floor(Math.random() * pool.length)];
            const textEl = document.getElementById('bobo-speech-text');
            const imgEl = document.getElementById('bobo-avatar');

            if (textEl) textEl.textContent = item.text;
            if (imgEl && item.img) loadSmartImage(imgEl, item.img);
        }

        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                localStorage.setItem('theme_mode', 'dark');
            } else {
                body.classList.add('light-mode');
                localStorage.setItem('theme_mode', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme_mode');
        if (savedTheme === 'light') document.body.classList.add('light-mode');

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            try {
                if (typeof Solar !== 'undefined') {
                    const solar = Solar.fromDate(now);
                    const lunar = solar.getLunar();
                    const gzYear = lunar.getYearInGanZhi();
                    const shengXiao = lunar.getYearShengXiao();
                    const lunarMonth = lunar.getMonthInChinese();
                    const lunarDay = lunar.getDayInChinese();
                    
                    let jieQi = lunar.getJieQi();
                    if (!jieQi) {
                        const prevJieQi = lunar.getPrevJieQi(true); 
                        if (prevJieQi) jieQi = prevJieQi.getName();
                    }

                    const lunarText = `${gzYear}, ${shengXiao}年${lunarMonth}月${lunarDay} | 節氣: ${jieQi || '--'}`;
                    document.getElementById('lunar-info').textContent = lunarText;
                }
            } catch (e) {}
        }

        async function updateHolidayCountdown() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const holidays = getFallbackHolidays();

            const upcoming = holidays.map(h => {
                const hDate = new Date(h.date);
                hDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((hDate - today) / (1000 * 60 * 60 * 24));
                return { ...h, diffDays };
            }).filter(h => h.diffDays >= 0).sort((a, b) => a.diffDays - b.diffDays);

            const el = document.getElementById('holiday-countdown');
            if (upcoming.length > 0) {
                const next = upcoming[0];
                let timeText = next.diffDays === 0 ? '就是今天！' : `${next.diffDays} 日後`;
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.25rem; color: var(--sub-text);">最近假期: <span style="color: var(--accent-blue); font-weight: bold;">${next.name}</span></span>
                        <span style="font-size: 1.4rem; font-weight: 800; color: var(--accent-yellow);">${timeText}</span>
                    </div>
                `;
            }
        }

        function getFallbackHolidays() {
            return [
                { name: "中秋節翌日", date: "2026-09-26" },
                { name: "國慶日", date: "2026-10-01" },
                { name: "重陽節", date: "2026-10-18" },
                { name: "聖誕節", date: "2026-12-25" },
                { name: "聖誕節後第一個周日", date: "2026-12-26" },
                { name: "元旦", date: "2027-01-01" }
            ];
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }

                if (tempData?.humidity?.data) {
                    const shatinHumid = tempData.humidity.data.find(i => i.place === "沙田") || tempData.humidity.data[0];
                    if (shatinHumid) document.getElementById('current-humidity').textContent = shatinHumid.value + '%';
                }

                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                        if (todayFc.PSR) {
                            document.getElementById('wx-rain').textContent = todayFc.PSR;
                        }
                    }
                }
            } catch (e) {}
            fetchWeatherWarnings();
        }

        async function fetchWeatherWarnings() {
    const warningBox = document.getElementById('weather-warning-box');
    
    try {
        let warningList = [];

        // 1. 先抓取 Warning Summary (warnsum)
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        if (res.ok) {
            const data = await res.json();
            
            // 處理熱帶氣旋專屬結構 WTyphoon
            if (data.WTyphoon) {
                warningList.push({
                    code: data.WTyphoon.code,
                    name: data.WTyphoon.name || '熱帶氣旋警告信號',
                    type: 'WTyphoon'
                });
            }

            // 處理其他一般警告
            for (const key in data) {
                if (key !== 'WTyphoon' && data[key] && typeof data[key] === 'object') {
                    const item = data[key];
                    if (item.name || item.code) {
                        warningList.push(item);
                    }
                }
            }
        }

        // 2. 若 warnsum 未抓到，備用讀取 Detailed Warning Info (warningInfo)
        if (warningList.length === 0) {
            const infoRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warningInfo&lang=tc');
            if (infoRes.ok) {
                const infoData = await infoRes.json();
                if (infoData.warningStatementCode) {
                    warningList.push({
                        code: infoData.warningStatementCode,
                        name: infoData.contents ? infoData.contents[0] : '天氣警告',
                        type: 'statement'
                    });
                }
            }
        }

        renderWarnings(warningList);
    } catch (err) { 
        warningBox.style.display = 'none'; 
    }
}

function renderWarnings(warningList) {
    const warningBox = document.getElementById('weather-warning-box');
    if (!warningList || warningList.length === 0) {
        warningBox.style.display = 'none';
        return;
    }

    let warningHtml = '';
    warningList.forEach(item => {
        let code = (item.code || '').toUpperCase();
        let nameText = item.name || '';
        let styleClass = '';
        let displayName = nameText;

        // 🌀 精準依據 HKO Code 或名稱比對風球與雨量信號
        if (code === 'TC1' || nameText.includes('一號') || nameText.includes('1號') || nameText.includes('戒備') || nameText.includes('黃色暴雨')) {
            styleClass = 'warning-yellow';
            if (code === 'TC1' && !nameText.includes('一號')) displayName = '一號戒備信號';
        } 
        else if (code === 'TC3' || nameText.includes('三號') || nameText.includes('3號') || nameText.includes('強風') || nameText.includes('紅色暴雨')) {
            styleClass = 'warning-red';
            if (code === 'TC3' && !nameText.includes('三號')) displayName = '三號強風信號';
        } 
        else if (code.startsWith('TC8') || code === 'TC9' || code === 'TC10' || nameText.includes('八號') || nameText.includes('九號') || nameText.includes('十號') || nameText.includes('黑色暴雨')) {
            styleClass = 'warning-black';
            if (code.startsWith('TC8') && !nameText.includes('八號')) displayName = '八號烈風或暴風信號';
            if (code === 'TC9') displayName = '九號烈風或暴風風力增強信號';
            if (code === 'TC10') displayName = '十號颶風信號';
        }

        // 自動繪製圖示
        let icon = '⚠️';
        if (code.startsWith('TC') || displayName.includes('信號') || displayName.includes('風球') || displayName.includes('戒備')) icon = '🌀';
        if (displayName.includes('暴雨')) icon = '🌧️';

        warningHtml += `<span class="warning-badge ${styleClass}">${icon} ${displayName}</span>`;
    });

    warningBox.innerHTML = warningHtml;
    warningBox.style.display = warningHtml ? 'flex' : 'none';
}

        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: var(--sub-text); text-align: center; padding: 20px;">暫無列車資料</div>';
                        return;
                    }

                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };
                    
                    let allTrains = [];
                    (stationData.DOWN || []).forEach(t => allTrains.push({ ...t, defaultDest: '屯門' }));
                    (stationData.UP || []).forEach(t => allTrains.push({ ...t, defaultDest: '烏溪沙' }));
                    
                    allTrains.sort((a, b) => new Date(a.time.replace(/-/g, '/')) - new Date(b.time.replace(/-/g, '/')));
                    const top4Trains = allTrains.slice(0, 4);

                    let html = '<div class="mtr-grid-2x2">';
                    for (let i = 0; i < 4; i++) {
                        html += renderMtrCardBig(top4Trains[i], destMap);
                    }
                    html += '</div>';
                    
                    container.innerHTML = html;
                }
            } catch (e) {}
        }

        function renderMtrCardBig(t, destMap) {
            if (!t) {
                return `
                    <div class="mtr-card-big" style="opacity: 0.35; justify-content: center;">
                        <span style="font-size: 1.1rem; color: var(--sub-text);">暫無班次</span>
                    </div>
                `;
            }
            const destName = destMap[t.dest] || t.dest || t.defaultDest;
            const trainTime = new Date(t.time.replace(/-/g, '/'));
            const diffMin = Math.round((trainTime - new Date()) / 60000);
            
            const hours = String(trainTime.getHours()).padStart(2, '0');
            const mins = String(trainTime.getMinutes()).padStart(2, '0');
            const clockTime = `${hours}:${mins}`;
            
            const timeText = diffMin <= 0 ? '即到' : `${diffMin} 分`;
            const destColor = (t.dest === 'WKS' || destName === '烏溪沙') ? 'var(--accent-blue)' : 'var(--accent-purple)';

            return `
                <div class="mtr-card-big">
                    <span style="font-size: 1.35rem; color: ${destColor}; font-weight: 800;">往 ${destName}</span>
                    <div style="font-size: 2.8rem; color: var(--accent-green); font-weight: 900; margin: 4px 0;">${timeText}</div>
                    <span style="font-size: 1.5rem; color: var(--accent-yellow); font-weight: bold;">${clockTime}</span>
                </div>
            `;
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(NPOINT_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    renderMemos(data);
                    localStorage.setItem('cached_memos', JSON.stringify(data));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(NPOINT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (!memos || memos.length === 0) {
                listEl.innerHTML = '<div style="color: var(--sub-text); text-align: center; padding: 12px; font-size: 1.3rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            if (!input.value.trim()) return;
            let memos = window.currentMemos || [];
            memos.push(input.value.trim());
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        window.onload = function() {
            updateTime();
            updateHolidayCountdown();
            fetchWeather();
            loadMemosFromCloud(); 
            fetchMTR();
            triggerBoboSpeech();
        };

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 300000); 
        setInterval(fetchMTR, 15000);
        setInterval(loadMemosFromCloud, 60000);
        setInterval(() => triggerBoboSpeech(), 600000);
    </script>
</body>
