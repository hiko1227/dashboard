<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Tablet Dashboard</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.045); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
            --accent-red: #f87171;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 10px; 
            margin: 0; 
            font-size: 1.1rem; 
            transition: background-color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        body.night-mode {
            --bg-color: #04060b;
            --card-bg: rgba(0, 0, 0, 0.45);
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 12px 18px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.1); 
            max-width: 1200px; 
            margin: 0 auto 10px auto; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        
        .header-left { display: flex; align-items: baseline; gap: 10px; font-size: 1.6rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-center { text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
        .clock { font-size: 2.4rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; text-shadow: 0 0 18px rgba(251,191,36,0.3); }
        .ampm { font-size: 1rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .header-right { display: flex; justify-content: flex-end; align-items: center; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 10px; max-width: 1200px; margin: auto; }
        
        .panel { 
            background: var(--card-bg); 
            padding: 12px 16px; 
            border-radius: 16px; 
            border: 1px solid rgba(52, 211, 153, 0.2); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            margin-bottom: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .panel-title { 
            font-size: 1.15rem; 
            color: var(--accent-green); 
            font-weight: 700; 
            margin-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
            padding-bottom: 6px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            letter-spacing: 0.5px;
        }
        
        .wx-box { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .wx-temp { font-size: 2.6rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }

        @keyframes warningBlink {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
            50% { opacity: 0.5; transform: scale(0.98); box-shadow: 0 0 2px rgba(248, 113, 113, 0.1); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
        }
        .warning-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .warning-badge {
            background: rgba(248, 113, 113, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.5);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            animation: warningBlink 1.5s infinite ease-in-out;
        }

        .memo-input-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
        .memo-input:focus { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(52,211,153,0.2); }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 16px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; font-weight: 600; gap: 8px; border: 1px solid rgba(255,255,255,0.06); }

        .memo-actions { display: flex; gap: 6px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .memo-delete { color: #f87171; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1.05rem; padding: 2px 4px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.15); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }

        .transit-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
            margin-top: 4px;
        }

        .transit-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.04);
        }

        .route-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-yellow);
            background: rgba(251, 191, 36, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(251, 191, 36, 0.35);
        }
        .transit-input-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .transit-input { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); padding: 8px 10px; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
        .transit-add-btn { background: var(--accent-blue); color: #0b0f19; border: none; padding: 0 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; white-space: nowrap; }

        .status-pill {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .pill-active-special { background: rgba(251, 191, 36, 0.25); color: var(--accent-yellow); border-color: rgba(251, 191, 36, 0.5); }
        .pill-active-normal { background: rgba(52, 211, 153, 0.2); color: var(--accent-green); border-color: rgba(52, 211, 153, 0.4); }
        .pill-dim { background: rgba(255, 255, 255, 0.03); color: #6b7280; opacity: 0.35; }

        @media (max-width: 850px) {
            .main-grid { grid-template-columns: 1fr; }
            .top-header { grid-template-columns: 1fr; gap: 10px; text-align: center; }
            .header-left, .header-center, .header-right { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-left">
            <span class="date-part" id="date-part">--</span>
            <span class="weekday-part" id="weekday-part">--</span>
        </div>
        <div class="header-center">
            <span class="clock" id="clock">00:00:00</span>
            <span class="ampm" id="ampm">--</span>
        </div>
        <div class="header-right" id="holiday-countdown">
            <span style="font-size: 0.95rem; color: #9ca3af;">計算假期中...</span>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <div class="panel">
                <div class="panel-title"><span>☀️ 天氣資訊</span></div>
                <div class="wx-box">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 48px; height: 48px; display: none;" onerror="this.style.display='none'">
                        <span class="wx-temp" id="current-temp">--°C</span>
                    </div>
                    <div style="text-align: right; font-size: 1.05rem; font-weight: 600;">
                        <div>最高: <span id="wx-max" style="color: var(--accent-orange);">--°C</span></div>
                        <div>最低: <span id="wx-min" style="color: var(--accent-blue);">--°C</span></div>
                    </div>
                </div>
                <div id="weather-warning-box" class="warning-container" style="display: none;"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 8px; font-size: 1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <div>
            <div class="panel">
                <div class="panel-title"><span>🚌 九巴實時到站</span></div>
                <div class="transit-input-box">
                    <input type="text" id="bus-route-input" class="transit-input" style="width: 70px; text-align: center;" placeholder="路線">
                    <input type="text" id="bus-stop-input" class="transit-input" style="width: 90px; text-align: center;" placeholder="站ID" value="003345">
                    <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱">
                    <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
                </div>
                <div class="transit-container" id="bus-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 12px; font-size: 1rem;">載入巴士資料中...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title"><span>🚇 港鐵恆安站 (屯馬線)</span></div>
                <div class="transit-container" id="mtr-eta-list" style="margin-top: 0; max-height: none;">
                    <div style="color: #9ca3af; text-align: center; padding: 8px; font-size: 0.95rem;">載入港鐵實時資料中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        const hkHolidays = [
            { name: "中秋節翌日", date: "2026-09-28" },
            { name: "國慶日", date: "2026-10-01" },
            { name: "重陽節", date: "2026-10-23" },
            { name: "聖誕節", date: "2026-12-25" },
            { name: "聖誕節後第一個周日", date: "2026-12-26" },
            { name: "元旦", date: "2027-01-01" },
            { name: "農曆年初一", date: "2027-02-06" },
            { name: "農曆年初二", date: "2027-02-07" },
            { name: "農曆年初三", date: "2027-02-08" },
            { name: "清明節", date: "2027-04-05" },
            { name: "復活節星期五", date: "2027-03-26" },
            { name: "勞動節", date: "2027-05-01" },
            { name: "佛誕", date: "2027-05-13" },
            { name: "端午節", date: "2027-06-09" }
        ];

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            const currentHour = now.getHours();
            if (currentHour >= 19 || currentHour < 6) {
                document.body.classList.add('night-mode');
            } else {
                document.body.classList.remove('night-mode');
            }
        }

        function updateHolidayCountdown() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const upcoming = hkHolidays.map(h => {
                const hDate = new Date(h.date);
                hDate.setHours(0, 0, 0, 0);
                const diffDays = Math.round((hDate - today) / (1000 * 60 * 60 * 24));
                return { ...h, diffDays };
            }).filter(h => h.diffDays >= 0);
            
            upcoming.sort((a, b) => a.diffDays - b.diffDays);
            
            const el = document.getElementById('holiday-countdown');
            if (upcoming.length > 0) {
                const next = upcoming[0];
                let timeText = next.diffDays === 0 ? '就是今天！' : `${next.diffDays} 日後`;
                el.innerHTML = `
                    <div style="text-align: right; display: flex; flex-direction: column; justify-content: center;">
                        <div style="font-size: 0.85rem; color: #9ca3af;">最近假期: <span style="color: var(--accent-blue); font-weight: bold;">${next.name}</span></div>
                        <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-yellow);">${timeText}</div>
                    </div>
                `;
            } else {
                el.innerHTML = `<div style="text-align: right; font-size: 0.9rem; color: #9ca3af;">暫無近期假期資料</div>`;
            }
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }
                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                    }
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '--°C';
            }
            fetchWeatherWarnings();
        }

        async function fetchWeatherWarnings() {
            const warningBox = document.getElementById('weather-warning-box');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                if (res.ok) {
                    const data = await res.json();
                    let warningHtml = '';
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            const warnItem = data[key];
                            if (warnItem && warnItem.name) {
                                warningHtml += `<span class="warning-badge">⚠️ ${warnItem.name}</span>`;
                            }
                        }
                    }
                    if (warningHtml !== '') {
                        warningBox.innerHTML = warningHtml;
                        warningBox.style.display = 'flex';
                    } else {
                        warningBox.innerHTML = '';
                        warningBox.style.display = 'none';
                    }
                }
            } catch (err) {
                warningBox.style.display = 'none';
            }
        }

        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 0.95rem;">暫無列車資料</div>';
                        return;
                    }

                    const downTrains = (stationData.DOWN || []).slice(0, 2);
                    const upTrains = (stationData.UP || []).slice(0, 2);
                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };

                    let gridHtml = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">';
                    for (let i = 0; i < 2; i++) {
                        gridHtml += renderMtrCell(downTrains[i], '屯門', destMap);
                        gridHtml += renderMtrCell(upTrains[i], '烏溪沙', destMap);
                    }
                    gridHtml += '</div>';
                    
                    container.innerHTML = gridHtml;
                }
            } catch (e) {}
        }

        function renderMtrCell(t, defaultDestName, destMap) {
            if (!t) {
                return `<div style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 8px; font-size: 0.9rem; color: #6b7280; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 48px;">暫無班次</div>`;
            }
            const destName = destMap[t.dest] || t.dest || defaultDestName;
            const trainTime = new Date(t.time.replace(/-/g, '/'));
            const diffMin = Math.round((trainTime - new Date()) / 60000);
            const trainHours = String(trainTime.getHours()).padStart(2, '0');
            const trainMinutes = String(trainTime.getMinutes()).padStart(2, '0');
            const clockTime = `${trainHours}:${trainMinutes}`;
            const timeText = diffMin <= 0 ? '即將到達' : `${diffMin} 分鐘`;
            const destColor = (t.dest === 'WKS') ? 'var(--accent-blue)' : 'var(--accent-purple)';

            return `
                <div style="background: rgba(0,0,0,0.35); border: 1px solid rgba(192,132,252,0.25); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between;">
                    <div style="font-size: 0.8rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        月台 ${t.plat} 往 <span style="color: ${destColor}; font-weight: bold;">${destName}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; font-size: 1.05rem;">
                        <span style="color: var(--accent-green); font-weight: bold;">${timeText}</span>
                        <span style="color: var(--accent-yellow); font-weight: bold;">${clockTime}</span>
                    </div>
                </div>
            `;
        }

        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();

            if (routes.length === 0) {
                container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1rem;">請於上方新增路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                try {
                    let etas = [];
                    // 修正為 st <= 2，避免因為查詢不存在嘅 seq 3 而導致整個連線中斷
                    for (let st = 1; st <= 2; st++) {
                        try {
                            const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/${st}`);
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.data) {
                                    if (Array.isArray(data.data)) {
                                        etas = etas.concat(data.data);
                                    } else {
                                        etas.push(data.data);
                                    }
                                }
                            }
                        } catch (err) {}
                    }
                    
                    let etasListHtml = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            
                            const uniqueEtas = [];
                            validEtas.forEach(e => {
                                const eTime = new Date(e.eta).getTime();
                                const isDuplicate = uniqueEtas.some(existing => {
                                    const exTime = new Date(existing.eta).getTime();
                                    return Math.abs(eTime - exTime) < 60000;
                                });
                                if (!isDuplicate) uniqueEtas.push(e);
                            });

                            const topEtas = uniqueEtas.slice(0, 3);
                            
                            etasListHtml = topEtas.map((e, idx) => {
                                const nextTime = new Date(e.eta);
                                const diffMin = Math.round((nextTime - new Date()) / 60000);
                                const timeStr = diffMin <= 1 ? '將到達' : `${diffMin} 分鐘`;
                                
                                const hours = String(nextTime.getHours()).padStart(2, '0');
                                const mins = String(nextTime.getMinutes()).padStart(2, '0');
                                const clockTime = `${hours}:${mins}`;

                                const rmkText = e.rmk_tc && e.rmk_tc.trim() !== '' ? e.rmk_tc.trim() : '';
                                const isSpecial = (e.service_type && e.service_type > 1) || 
                                                  (rmkText !== '' && rmkText !== '原定班次' && (rmkText.includes('特別') || rmkText.includes('特班') || rmkText.includes('特別班次')));
                                
                                const specialClass = isSpecial ? 'pill-active-special' : 'pill-dim';
                                const normalClass = !isSpecial ? 'pill-active-normal' : 'pill-dim';

                                return `
                                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1rem; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px;">
                                        <span style="color: #9ca3af;">${idx + 1}: <strong style="color: var(--accent-green);">${timeStr}</strong> <span style="font-size: 0.85rem;">(${clockTime})</span></span>
                                        <div style="display: flex; gap: 4px; align-items: center;">
                                            <span class="status-pill ${specialClass}">特別</span>
                                            <span class="status-pill ${normalClass}">普通</span>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } else {
                            etasListHtml = '<div style="color: #9ca3af; font-size: 1rem; margin-top: 4px;">暫無班次</div>';
                        }
                    } else {
                        etasListHtml = '<div style="color: #9ca3af; font-size: 1rem; margin-top: 4px;">暫無班次</div>';
                    }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span class="route-badge">${r.route}</span>
                                        ${r.name ? `<span style="font-size: 1.1rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                    </div>
                                    <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.2rem; padding: 0;">✕</button>
                                </div>
                                <div>${etasListHtml}</div>
                            </div>
                        </div>
                    `;
                } catch (err) {}
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            const stopVal = stopInput.value.trim() || '003345';
            const nameVal = nameInput.value.trim();

            if (!routeVal) return;
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopVal, name: nameVal });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = '';
            nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 8px; font-size: 1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;
            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        updateHolidayCountdown();
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
