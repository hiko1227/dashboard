<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Dashboard</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 6px; 
            margin: 0; 
            font-size: 1.1rem;
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 8px 14px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.08); 
            max-width: 1200px; 
            margin: 0 auto 6px auto; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .header-left { display: flex; align-items: baseline; gap: 8px; font-size: 2rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-center { text-align: right; display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
        .clock { font-size: 2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .ampm { font-size: 1rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 6px; max-width: 1200px; margin: auto; }
        .panel { 
            background: var(--card-bg); padding: 8px 12px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); margin-bottom: 6px;
        }
        .panel-title { 
            font-size: 1.15rem; color: var(--accent-green); font-weight: 700; margin-bottom: 6px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 4px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .wx-box { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
        .wx-temp { font-size: 2.4rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }

        .memo-input-box { display: flex; gap: 6px; margin-bottom: 6px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 1.05rem; outline: none; }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; font-weight: 600; gap: 6px; }
        .memo-actions { display: flex; gap: 3px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 1px 5px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .memo-action-btn:hover { background: rgba(255,255,255,0.2); }
        .memo-delete { color: #f87171; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; padding: 1px 3px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); padding: 2px 8px; border-radius: 5px; font-size: 0.85rem; cursor: pointer; }

        .transit-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 380px;
            overflow-y: auto;
            margin-top: 4px;
        }
        .transit-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .route-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-yellow);
            background: rgba(251, 191, 36, 0.15);
            padding: 1px 6px;
            border-radius: 5px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .transit-input-box {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .transit-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 8px;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .transit-add-btn {
            background: var(--accent-blue);
            color: #0b0f19;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 狀態燈標籤 (特別 / 普通) */
        .status-pill {
            font-size: 0.75rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .pill-active-special {
            background: rgba(251, 191, 36, 0.25);
            color: var(--accent-yellow);
            border-color: rgba(251, 191, 36, 0.5);
        }
        .pill-active-normal {
            background: rgba(52, 211, 153, 0.2);
            color: var(--accent-green);
            border-color: rgba(52, 211, 153, 0.4);
        }
        .pill-dim {
            background: rgba(255, 255, 255, 0.03);
            color: #6b7280;
            opacity: 0.4;
        }

        /* 港鐵 4個正方形網格 */
        .mtr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .mtr-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-left">
            <span class="date-part" id="date-part">--</span>
            <span class="weekday-part" id="weekday-part">--</span>
        </div>
        <div class="header-center">
            <span class="clock" id="clock">00:00:00</span>
            <span class="ampm" id="ampm">--</span>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左邊欄 -->
        <div>
            <!-- 天氣面板 -->
            <div class="panel">
                <div class="panel-title"><span>☀️ 天氣</span></div>
                <div class="wx-box">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 46px; height: 46px; display: none;" onerror="this.style.display='none'">
                        <span class="wx-temp" id="current-temp">--°C</span>
                    </div>
                    <div style="text-align: right; font-size: 1.05rem; font-weight: 600;">
                        <div>最高: <span id="wx-max" style="color: var(--accent-orange);">--°C</span></div>
                        <div>最低: <span id="wx-min" style="color: var(--accent-blue);">--°C</span></div>
                    </div>
                </div>
            </div>

            <!-- 備忘錄面板 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <!-- 右邊欄 -->
        <div>
            <!-- 九巴實時 ETA 面板 -->
            <div class="panel">
                <div class="transit-input-box">
                    <input type="text" id="bus-route-input" class="transit-input" style="width: 65px; text-align: center;" placeholder="路線">
                    <input type="text" id="bus-stop-input" class="transit-input" style="width: 80px; text-align: center;" placeholder="站ID" value="003345">
                    <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱">
                    <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
                </div>
                <div class="transit-container" id="bus-eta-list">
                    <div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1rem;">載入九巴資料中...</div>
                </div>
            </div>

            <!-- 港鐵恆安站 API 實時面板 (4個正方形網格) -->
            <div class="panel">
                <div class="transit-container" id="mtr-eta-list" style="margin-top: 0;">
                    <div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 1rem;">載入港鐵實時資料中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }
                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                    }
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '--°C';
            }
        }

        // 港鐵 API 抓取 (恆安站 TML-HEO) - 4個正方形格仔排版
        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">暫無列車資料</div>';
                        return;
                    }

                    let allTrains = [];
                    if (stationData.UP) {
                        stationData.UP.forEach(t => allTrains.push({ ...t, dir: 'UP' }));
                    }
                    if (stationData.DOWN) {
                        stationData.DOWN.forEach(t => allTrains.push({ ...t, dir: 'DOWN' }));
                    }

                    allTrains.forEach(t => {
                        t.parsedTime = new Date(t.time.replace(/-/g, '/'));
                    });
                    allTrains.sort((a, b) => a.parsedTime - b.parsedTime);

                    const topTrains = allTrains.slice(0, 4);
                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };

                    if (topTrains.length === 0) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">暫無班次</div>';
                        return;
                    }

                    let gridHtml = '<div class="mtr-grid">';
                    topTrains.forEach(t => {
                        const destName = destMap[t.dest] || t.dest;
                        const diffMin = Math.round((t.parsedTime - new Date()) / 60000);
                        
                        const trainHours = String(t.parsedTime.getHours()).padStart(2, '0');
                        const trainMinutes = String(t.parsedTime.getMinutes()).padStart(2, '0');
                        const clockTime = `${trainHours}:${trainMinutes}`;

                        const timeText = diffMin <= 0 ? '即將到達' : `${diffMin} 分鐘`;
                        const destColor = (t.dest === 'WKS') ? 'var(--accent-blue)' : 'var(--accent-purple)';

                        gridHtml += `
                            <div class="mtr-card">
                                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                                    <span style="color: #9ca3af;">月台 ${t.plat}</span>
                                    <span style="color: var(--accent-green); font-weight: bold; font-size: 0.95rem;">${timeText}</span>
                                </div>
                                <div style="margin: 4px 0;">
                                    <div style="font-size: 0.8rem; color: #9ca3af; line-height: 1;">往</div>
                                    <div style="font-size: 1.1rem; font-weight: 800; color: ${destColor};">${destName}</div>
                                </div>
                                <div style="text-align: right; font-size: 0.8rem; color: #9ca3af;">${clockTime}</div>
                            </div>
                        `;
                    });
                    gridHtml += '</div>';
                    container.innerHTML = gridHtml;
                } else {
                    container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 6px; font-size: 1rem;">港鐵系統維護中</div>';
                }
            } catch (e) {
                container.innerHTML = '<div style="color: #f87171; text-align: center; padding: 6px; font-size: 1rem;">港鐵連線失敗</div>';
            }
        }

        // 九巴自選路線管理
        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();

            if (routes.length === 0) {
                container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 8px; font-size: 1rem;">請於上方新增路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                
                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/1`);
                    const data = await res.json();
                    const etas = data.data;
                    
                    let etasListHtml = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            const topEtas = validEtas.slice(0, 4);
                            etasListHtml = topEtas.map((e, idx) => {
                                const nextTime = new Date(e.eta);
                                const diffMin = Math.round((nextTime - new Date()) / 60000);
                                const timeStr = diffMin <= 1 ? '將到達' : `${diffMin} 分鐘`;
                                
                                const hours = String(nextTime.getHours()).padStart(2, '0');
                                const mins = String(nextTime.getMinutes()).padStart(2, '0');
                                const clockTime = `${hours}:${mins}`;

                                const label = idx === 0 ? '首班' : `後${idx}`;
                                
                                // 特別 / 普通 標籤判斷
                                const rmkText = e.rmk_tc && e.rmk_tc.trim() !== '' ? e.rmk_tc : '';
                                const isSpecial = rmkText !== '';
                                
                                const specialClass = isSpecial ? 'pill-active-special' : 'pill-dim';
                                const normalClass = !isSpecial ? 'pill-active-normal' : 'pill-dim';

                                return `
                                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; margin-top: 2px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 2px;">
                                        <span style="color: #9ca3af;">${label}: <strong style="color: var(--accent-green);">${timeStr}</strong> <span style="font-size: 0.8rem;">(${clockTime})</span></span>
                                        <div style="display: flex; gap: 3px; align-items: center;">
                                            <span class="status-pill ${specialClass}">特別${rmkText ? ': ' + rmkText : ''}</span>
                                            <span class="status-pill ${normalClass}">普通</span>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } else {
                            etasListHtml = '<div style="color: #9ca3af; font-size: 0.95rem; margin-top: 2px;">暫無班次</div>';
                        }
                    } else {
                        etasListHtml = '<div style="color: #9ca3af; font-size: 0.95rem; margin-top: 2px;">暫無班次</div>';
                    }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <span class="route-badge">${r.route}</span>
                                        ${r.name ? `<span style="font-size: 1.05rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                    </div>
                                    <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.1rem; padding: 0;">✕</button>
                                </div>
                                <div>
                                    ${etasListHtml}
                                </div>
                            </div>
                        </div>
                    `;
                } catch (err) {
                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <span class="route-badge">${r.route}</span>
                                    <span style="font-size: 1rem; font-weight: bold; color: var(--accent-blue); margin-left: 6px;">${r.name || ''}</span>
                                    <span style="color: #f87171; font-size: 0.95rem; margin-left: 8px;">讀取失敗</span>
                                </div>
                                <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:bold; font-size:1.1rem;">✕</button>
                            </div>
                        </div>
                    `;
                }
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            const stopVal = stopInput.value.trim() || '003345';
            const nameVal = nameInput.value.trim();

            if (!routeVal) return;
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopVal, name: nameVal });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = '';
            nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;
            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
